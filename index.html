
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فأني قريب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <div class="mosque-icon"></div>
            <div class="quran-icon"></div>
            <h1>فأني قريب</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#prayer-times">مواعيد الصلاة</a></li>
                <li><a href="#quran">القرآن الكريم</a></li>
                <li><a href="#hadith">الأحاديث النبوية</a></li>
                <li><a href="#dua">الأدعية والأذكار</a></li>
                <li><a href="#tasbeeh">السبحة الإلكترونية</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="prayer-times">
            <h2>مواعيد الصلاة</h2>
            <div id="prayer-times-content"></div>
        </section>
        <section id="quran">
            <h2>القرآن الكريم</h2>
            <div id="quran-content"></div>
        </section>
        <section id="hadith">
            <h2>الأحاديث النبوية</h2>
            <div id="hadith-content"></div>
        </section>
        <section id="dua">
            <h2>الأدعية والأذكار</h2>
            <div id="dua-content"></div>
        </section>
        <section id="tasbeeh">
            <h2>السبحة الإلكترونية</h2>
            <div class="tasbeeh-container">
                <button onclick="tasbeeh('سبحان الله')">سبحان الله</button>
                <button onclick="tasbeeh('الحمد لله')">الحمد لله</button>
                <button onclick="tasbeeh('الله أكبر')">الله أكبر</button>
                <button onclick="tasbeeh('لا حول ولا قوة إلا بالله')">لا حول ولا قوة إلا بالله</button>
                <button onclick="tasbeeh('أستغفر الله')">أستغفر الله</button>
                <button onclick="tasbeeh('اللهم صل على النبي')">اللهم صل على النبي</button>
                <button onclick="tasbeeh('لا إله إلا الله')">لا إله إلا الله</button>
                <p id="counter">العدد: 0</p>
            </div>
        </section>
    </main>
    <footer>
        <p>تصميم المبرمج :محمود محمد محمود أبو الفتوح احمد العزيري</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
