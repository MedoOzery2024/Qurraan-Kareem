

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فإني قريب</title> 
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="شعار فإني قريب" class="logo">
        <h1>فإني قريب</h1>
        <p class="subtitle">موقع إسلامي شامل القرآن، الحديث، الأذكار، الأدعية، مواقيت الصلاة والسبحة الإلكترونية</p>
        <span class="developer">تصميم المبرمج: محمود محمد محمود أبو الفتوح احمد العزيري</span>
    </header>
    <nav>
        <button type="button" onclick="showSection('quran')">القرآن الكريم</button>
        <button type="button" onclick="showSection('hadith')">الأحاديث النبوية</button>
        <button type="button" onclick="showSection('azkar')">الأذكار والأدعية</button>
        <button type="button" onclick="showSection('prayer')">مواقيت الصلاة</button>
        <button type="button" onclick="showSection('sebha')">السبحة الإلكترونية</button>
    </nav>
    <main>
        <section id="quran" class="content-section">
            <h2>القرآن الكريم</h2>
            <div id="quran-content">
                <select id="surah-selector"></select>
                <div id="ayahs"></div>
            </div>
        </section>
        <section id="hadith" class="content-section hidden">
            <h2>الأحاديث النبوية الشريفة</h2>
            <div id="hadith-content">
                <select id="hadith-book"></select>
                <select id="hadith-number"></select>
                <div id="hadith-text"></div>
            </div>
        </section>
        <section id="azkar" class="content-section hidden">
            <h2>الأذكار والأدعية</h2>
            <div id="azkar-content">
                <select id="azkar-type">
                    <option value="morning">أذكار الصباح</option>
                    <option value="evening">أذكار المساء</option>
                    <option value="prayer">أذكار بعد الصلاة</option>
                    <option value="dua">أدعية متنوعة</option>
                </select>
                <div id="azkar-list"></div>
            </div>
        </section>
        <section id="prayer" class="content-section hidden">
            <h2>مواقيت الصلاة</h2>
            <div id="prayer-times">
                <input type="text" id="city-input" placeholder="ادخل اسم المدينة">
                <button type="button" id="get-prayer-times">عرض المواقيت</button>
                <div id="prayer-result"></div>
            </div>
        </section>
        <section id="sebha" class="content-section hidden">
            <h2>السبحة الإلكترونية</h2>
            <div id="sebha-content">
                <select id="sebha-type">
                    <option>سبحان الله</option>
                    <option>الحمد لله</option>
                    <option>يوماً وعمراً على كل حال</option>
                    <option>الله أكبر</option>
                    <option>ولا حول ولا قوة إلا بالله العلي العظيم</option>
                    <option>وأتوب إليه عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته</option>
                    <option>اللهم صل على النبي</option>
                    <option>لا إله إلا الله</option>
                </select>
                <div class="sebha-counter">
                    <button type="button" id="sebha-increment">تسبيح</button>
                    <span id="sebha-count">0</span>
                    <button type="button" id="sebha-reset">إعادة</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 فإني قريب | جميع الحقوق محفوظة</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
